[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astroagent"
version = "0.1.0"
description = "AI-powered astronomical research agent with 3D visualization — query NASA databases with natural language and explore planetary systems interactively."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Ravindra Bhavsar" },
]
keywords = [
    "astronomy",
    "exoplanets",
    "ai-agent",
    "llm",
    "claude",
    "jupyter",
    "visualization",
    "nasa",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anthropic>=0.40.0",
    "astroquery>=0.4.7",
    "astropy>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "httpx>=0.27",
    "ipython>=8.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/ravindrabhr/astroagent-3d"
Repository = "https://github.com/ravindrabhr/astroagent-3d"
Issues = "https://github.com/ravindrabhr/astroagent-3d/issues"
Documentation = "https://github.com/ravindrabhr/astroagent-3d#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/astroagent"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["src/astroagent/viz/galaxy_explorer.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101", "S110", "S608", "TC002", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"src/astroagent/viz/*" = ["E501"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["astroagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that hit real APIs (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring API keys",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
